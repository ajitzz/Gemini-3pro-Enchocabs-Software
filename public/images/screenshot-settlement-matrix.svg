      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <filter id="shadowSet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#setBg)"/>

  <!-- Browser Container -->
  <g transform="translate(40, 30)" filter="url(#shadowSet)">
