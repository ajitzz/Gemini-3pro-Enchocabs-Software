<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="glowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="glowSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="620" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200 M0 480 H1200 M0 540 H1200"/>
    <path d="M120 0 V620 M240 0 V620 M360 0 V620 M480 0 V620 M600 0 V620 M720 0 V620 M840 0 V620 M960 0 V620 M1080 0 V620"/>
  </g>

  <!-- Title & Section Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">SYSTEM ARCHITECTURE SPECIFICATION</text>
    <text x="0" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800">
      Multi-Tier Reactive Engine &amp; Asynchronous Pipeline
    </text>
  </g>

  <!-- Layer 1: Client Layer (Left Column) -->
  <g transform="translate(60, 110)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="240" height="460" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="40" rx="14" fill="rgba(56, 189, 248, 0.1)"/>
    <text x="20" y="25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">1. CLIENT TIER</text>

    <!-- Client Card 1 -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="210" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Admin Operations</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Daily Entry, Wallets, Audit</text>
      <rect x="14" y="56" width="60" height="18" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="20" y="69" fill="#38bdf8" font-family="monospace" font-size="10">React 18</text>
      <rect x="80" y="56" width="70" height="18" rx="4" fill="rgba(99, 102, 241, 0.15)"/>
      <text x="86" y="69" fill="#818cf8" font-family="monospace" font-size="10">Tailwind</text>
    </g>

    <!-- Client Card 2 -->
    <g transform="translate(15, 160)">
      <rect x="0" y="0" width="210" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Driver Portal &amp; PWA</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Self-serve balance, shifts</text>
      <rect x="14" y="56" width="90" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="20" y="69" fill="#34d399" font-family="monospace" font-size="10">Public Link</text>
      <rect x="110" y="56" width="55" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="116" y="69" fill="#fbbf24" font-family="monospace" font-size="10">Mobile</text>
    </g>

    <!-- Client Card 3 -->
    <g transform="translate(15, 260)">
      <rect x="0" y="0" width="210" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Manager Access</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Child driver assignments</text>
      <rect x="14" y="56" width="65" height="18" rx="4" fill="rgba(168, 85, 247, 0.15)"/>
      <text x="20" y="69" fill="#c084fc" font-family="monospace" font-size="10">RBAC</text>
    </g>

    <!-- SSE Listener Box -->
    <g transform="translate(15, 360)">
      <rect x="0" y="0" width="210" height="80" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#10b981"/>
      <text x="28" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">SSE Event Bus</text>
      <text x="14" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Live reactive UI updates</text>
      <text x="14" y="62" fill="#64748b" font-family="monospace" font-size="9">daily_entries_changed</text>
    </g>
  </g>

  <!-- Connectors from Client to Gateway -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M300 210 H350"/>
    <path d="M300 310 H350"/>
    <path d="M350 430 H300"/>
  </g>

  <!-- Layer 2: API Gateway & Lock Protection (Middle-Left) -->
  <g transform="translate(350, 110)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="260" height="460" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="40" rx="14" fill="rgba(99, 102, 241, 0.1)"/>
    <text x="20" y="25" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">2. GATEWAY &amp; LOCK LAYER</text>

    <!-- Node 1: Fast Express Router -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="230" height="90" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Express.js API Router</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">CORS wildcard validation</text>
      <text x="14" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Google OAuth Token Guard</text>
      <text x="14" y="76" fill="#38bdf8" font-family="monospace" font-size="10">Sub-40ms execution path</text>
    </g>

    <!-- Node 2: Dual Advisory Lock -->
    <g transform="translate(15, 165)">
      <rect x="0" y="0" width="230" height="110" rx="8" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
      <text x="14" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Dual pg_advisory_lock</text>
      <text x="14" y="44" fill="#cbd5e1" font-family="monospace" font-size="10">lock1 = hash(driver)</text>
      <text x="14" y="60" fill="#cbd5e1" font-family="monospace" font-size="10">lock2 = hash(date/week)</text>
      <text x="14" y="80" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">100 concurrent threads safe</text>
      <text x="14" y="96" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Zero race conditions</text>
    </g>

    <!-- Node 3: SSE Broadcaster -->
    <g transform="translate(15, 290)">
      <rect x="0" y="0" width="230" height="75" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Live SSE Dispatcher</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Stream event pipe /api/live</text>
      <text x="14" y="62" fill="#34d399" font-family="monospace" font-size="10">Active heartbeat: 25s</text>
    </g>

    <!-- Node 4: Targeted Deferral Helper -->
    <g transform="translate(15, 380)">
      <rect x="0" y="0" width="230" height="65" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">deferDriverBillingSync()</text>
      <text x="14" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Decouples heavy calculations</text>
      <text x="14" y="56" fill="#fbbf24" font-family="monospace" font-size="10">QStash || Native EventLoop</text>
    </g>
  </g>

  <!-- Connectors from Gateway to Async Queue and Database -->
  <g stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M610 220 H670"/>
    <path d="M610 410 H670"/>
  </g>

  <!-- Layer 3: Async Queue & Caching Layer (Middle-Right) -->
  <g transform="translate(670, 110)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="240" height="460" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="40" rx="14" fill="rgba(245, 158, 11, 0.1)"/>
    <text x="20" y="25" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">3. ASYNC QUEUE &amp; CACHE</text>

    <!-- QStash Card -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="210" height="115" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Upstash QStash Queue</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Serverless async execution</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="monospace" font-size="10">Deduplication: ID-per-week</text>
      <text x="14" y="82" fill="#38bdf8" font-family="monospace" font-size="10">Auto-retry on failure</text>
      <rect x="14" y="90" width="80" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="20" y="103" fill="#fbbf24" font-family="monospace" font-size="9">Zero-Wait</text>
    </g>

    <!-- Redis Cache Card -->
    <g transform="translate(15, 190)">
      <rect x="0" y="0" width="210" height="120" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Upstash Redis (TLS)</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Query-aware key cache</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="monospace" font-size="10">Prefix: cache:daily_entries</text>
      <text x="14" y="80" fill="#cbd5e1" font-family="monospace" font-size="10">TTL: 300s + Auto-Bypass</text>
      <text x="14" y="100" fill="#34d399" font-family="monospace" font-size="10">Fast cache invalidation</text>
    </g>

    <!-- Background Sync Worker -->
    <g transform="translate(15, 325)">
      <rect x="0" y="0" width="210" height="115" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
      <text x="14" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Billing Sync Worker</text>
      <text x="14" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Computes rent based on leaves</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="monospace" font-size="10">Days worked formula</text>
      <text x="14" y="82" fill="#cbd5e1" font-family="monospace" font-size="10">Rent per day sync</text>
      <text x="14" y="100" fill="#38bdf8" font-family="monospace" font-size="10">driver_billings update</text>
    </g>
  </g>

  <!-- Connectors from Queue to Storage and WhatsApp -->
  <g stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M910 240 H960"/>
    <path d="M910 380 H960"/>
  </g>

  <!-- Layer 4: Storage & Integration Layer (Right Column) -->
  <g transform="translate(960, 110)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="180" height="460" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="40" rx="14" fill="rgba(16, 185, 129, 0.1)"/>
    <text x="16" y="25" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">4. PERSISTENCE &amp; META</text>

    <!-- PostgreSQL Neon Database -->
    <g transform="translate(12, 60)">
      <rect x="0" y="0" width="156" height="195" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="10" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">PostgreSQL (Neon)</text>
      <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">PgBouncer Pooled</text>

      <text x="10" y="60" fill="#38bdf8" font-family="monospace" font-size="9">• daily_entries</text>
      <text x="10" y="76" fill="#38bdf8" font-family="monospace" font-size="9">• weekly_wallets</text>
      <text x="10" y="92" fill="#38bdf8" font-family="monospace" font-size="9">• driver_billings</text>
      <text x="10" y="108" fill="#38bdf8" font-family="monospace" font-size="9">• leaves (daterange)</text>
      <text x="10" y="124" fill="#38bdf8" font-family="monospace" font-size="9">• shifts</text>
      <text x="10" y="140" fill="#38bdf8" font-family="monospace" font-size="9">• admin_access</text>
      <text x="10" y="156" fill="#38bdf8" font-family="monospace" font-size="9">• manager_access</text>
      <text x="10" y="172" fill="#38bdf8" font-family="monospace" font-size="9">• assets (qr/vehicle)</text>

      <rect x="8" y="178" width="140" height="12" rx="3" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="14" y="187" fill="#34d399" font-family="monospace" font-size="8">UNIQUE(driver, date)</text>
    </g>

    <!-- Meta WhatsApp Cloud API -->
    <g transform="translate(12, 270)">
      <rect x="0" y="0" width="156" height="170" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="10" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Meta WhatsApp</text>
      <text x="10" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">Cloud API Graph v21</text>
      <text x="10" y="66" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Zero Placeholders</text>
      <text x="10" y="82" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Structured CRM flow</text>
      <text x="10" y="98" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Weekly Payout PDF</text>
      <text x="10" y="114" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Lead auto-routing</text>
      <rect x="10" y="130" width="136" height="26" rx="6" fill="#047857"/>
      <text x="18" y="147" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">Validated Dispatch</text>
    </g>
  </g>
</svg>
