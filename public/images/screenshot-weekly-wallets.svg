<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="wwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGradW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowW" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#wwBg)"/>

  <!-- Browser Container -->
  <g transform="translate(40, 30)" filter="url(#shadowW)">
    <rect x="0" y="0" width="1120" height="690" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

    <!-- Titlebar -->
    <rect x="0" y="0" width="1120" height="44" rx="16" fill="#0f172a"/>
    <rect x="0" y="32" width="1120" height="12" fill="#0f172a"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>

    <rect x="110" y="9" width="560" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="130" y="26" fill="#94a3b8" font-family="monospace" font-size="11">https://encho-cabs.prod/weekly-wallets • Aggregator Balance Reconciliation</text>

