          <text x="0" y="82" fill="#38bdf8" font-family="monospace" font-size="11">&bull; rentOverride: Sets a customized flat rent rate per day for negotiated agreements</text>
          <text x="0" y="102" fill="#fbbf24" font-family="monospace" font-size="11">&bull; adjustments: Adds or subtracts manual bonus credits or damage liabilities directly</text>
