          <text x="14" y="19" fill="#94a3b8" font-family="sans-serif" font-size="11">Edit</text>
          <rect x="62" y="0" width="40" height="28" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="0.5"/>
          <text x="74" y="19" fill="#f87171" font-family="sans-serif" font-size="11">🗑</text>
