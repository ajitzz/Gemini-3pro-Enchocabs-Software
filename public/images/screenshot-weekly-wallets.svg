        <rect x="235" y="0" width="165" height="38" rx="8" fill="#6366f1"/>
        <text x="250" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">+ Add Week Wallet</text>
