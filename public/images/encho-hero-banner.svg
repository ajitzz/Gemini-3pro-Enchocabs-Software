<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="500" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#4f46e5" opacity="0.18" filter="url(#glowEffect)"/>
  <circle cx="950" cy="380" r="160" fill="#059669" opacity="0.15" filter="url(#glowEffect)"/>
  <circle cx="1050" cy="100" r="120" fill="#0284c7" opacity="0.16" filter="url(#glowEffect)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200 M0 400 H1200 M0 450 H1200"/>
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500 M500 0 V500 M600 0 V500 M700 0 V500 M800 0 V500 M900 0 V500 M1000 0 V500 M1100 0 V500"/>
  </g>

  <!-- Left Hero Copy & Identity -->
  <g transform="translate(80, 80)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#34d399"/>
    <text x="30" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ENCHO MASTER ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Fleet Performance &amp;
    </text>
    <text x="0" y="135" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Financial Settlement OS
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" width="500">
      Enterprise-grade fleet operations platform powered by ACID transaction locks,
    </text>
    <text x="0" y="198" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      sub-40ms latency deferral, automated WhatsApp CRM, and zero ghost-entry safety.
    </text>

    <!-- Feature Metric Pills -->
    <g transform="translate(0, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="42" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="14" y="26" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700">&lt; 38ms</text>
      <text x="75" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">P99 Latency</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="165" height="42" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="169" y="26" fill="#34d399" font-family="monospace" font-size="16" font-weight="700">0 Races</text>
      <text x="238" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Advisory Lock</text>

      <!-- Pill 3 -->
      <rect x="330" y="0" width="160" height="42" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <text x="344" y="26" fill="#a78bfa" font-family="monospace" font-size="16" font-weight="700">100%</text>
      <text x="393" y="26" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">ACID Integrity</text>
    </g>

    <!-- Tech Stack Mini Badges -->
    <g transform="translate(0, 305)">
      <text x="0" y="16" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1">BUILT WITH</text>
      <g transform="translate(85, 0)">
        <rect x="0" y="0" width="70" height="24" rx="6" fill="#1e293b"/>
        <text x="14" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">React 18</text>
        <rect x="76" y="0" width="85" height="24" rx="6" fill="#1e293b"/>
        <text x="90" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">PostgreSQL</text>
        <rect x="167" y="0" width="78" height="24" rx="6" fill="#1e293b"/>
        <text x="180" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Express JS</text>
        <rect x="251" y="0" width="65" height="24" rx="6" fill="#1e293b"/>
        <text x="264" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">QStash</text>
        <rect x="322" y="0" width="62" height="24" rx="6" fill="#1e293b"/>
        <text x="335" y="16" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Redis</text>
      </g>
    </g>
  </g>

  <!-- Right Dashboard Visual Cards -->
  <g transform="translate(680, 50)" filter="url(#cardShadow)">
    <!-- Primary Mockup Window -->
    <rect x="0" y="0" width="460" height="390" rx="18" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <rect x="0" y="0" width="460" height="42" rx="18" fill="rgba(15, 23, 42, 0.6)"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <text x="75" y="25" fill="#64748b" font-family="monospace" font-size="11">encho-portal.prod/dashboard</text>
    <rect x="365" y="12" width="75" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <circle cx="376" cy="21" r="3" fill="#10b981"/>
    <text x="384" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">LIVE SYNC</text>

    <!-- Top KPI Widgets Inside Card -->
    <g transform="translate(20, 60)">
      <!-- KPI 1 -->
      <rect x="0" y="0" width="130" height="80" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Weekly Net Payout</text>
      <text x="14" y="52" fill="#34d399" font-family="monospace" font-size="20" font-weight="800">₹84,250</text>
      <text x="14" y="70" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">▲ 14.2% vs last wk</text>

      <!-- KPI 2 -->
      <rect x="145" y="0" width="130" height="80" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="159" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Active Fleet</text>
      <text x="159" y="52" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="800">28 / 30</text>
      <text x="159" y="70" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">93.3% Utilization</text>

      <!-- KPI 3 -->
      <rect x="290" y="0" width="130" height="80" rx="12" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="304" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Dispute Margin</text>
      <text x="304" y="52" fill="#a78bfa" font-family="monospace" font-size="20" font-weight="800">0.00%</text>
      <text x="304" y="70" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Zero variance</text>
    </g>

    <!-- Mini Settlement Table Preview -->
    <g transform="translate(20, 160)">
      <rect x="0" y="0" width="420" height="195" rx="12" fill="rgba(15, 23, 42, 0.5)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

      <!-- Table Header -->
      <rect x="0" y="0" width="420" height="32" rx="12" fill="rgba(30, 41, 59, 0.4)"/>
      <text x="15" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">DRIVER / QR</text>
      <text x="120" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">DAYS</text>
      <text x="175" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">RENT/DAY</text>
      <text x="250" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">WALLET</text>
      <text x="330" y="20" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">NET DUE</text>

      <!-- Row 1 -->
      <g transform="translate(0, 36)">
        <text x="15" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Ramesh K.</text>
        <text x="15" y="32" fill="#64748b" font-family="monospace" font-size="9">QR: #0821</text>
        <text x="120" y="22" fill="#94a3b8" font-family="monospace" font-size="11">6 days</text>
        <text x="175" y="22" fill="#94a3b8" font-family="monospace" font-size="11">₹1,100</text>
        <text x="250" y="22" fill="#38bdf8" font-family="monospace" font-size="11">₹9,450</text>
        <rect x="325" y="8" width="80" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="335" y="23" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">₹2,850 Cr</text>
      </g>

      <!-- Row Divider -->
      <line x1="15" y1="80" x2="405" y2="80" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

      <!-- Row 2 -->
      <g transform="translate(0, 86)">
        <text x="15" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Suresh V.</text>
        <text x="15" y="32" fill="#64748b" font-family="monospace" font-size="9">QR: #0419</text>
        <text x="120" y="22" fill="#94a3b8" font-family="monospace" font-size="11">5 days</text>
        <text x="175" y="22" fill="#94a3b8" font-family="monospace" font-size="11">₹1,200</text>
        <text x="250" y="22" fill="#38bdf8" font-family="monospace" font-size="11">₹7,200</text>
        <rect x="325" y="8" width="80" height="22" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
        <text x="335" y="23" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">₹1,200 Cr</text>
      </g>

      <!-- Row Divider -->
      <line x1="15" y1="130" x2="405" y2="130" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

      <!-- Row 3 -->
      <g transform="translate(0, 136)">
        <text x="15" y="20" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Arun Kumar</text>
        <text x="15" y="32" fill="#64748b" font-family="monospace" font-size="9">QR: #0902</text>
        <text x="120" y="22" fill="#94a3b8" font-family="monospace" font-size="11">3 days</text>
        <text x="175" y="22" fill="#94a3b8" font-family="monospace" font-size="11">₹1,300</text>
        <text x="250" y="22" fill="#38bdf8" font-family="monospace" font-size="11">₹3,400</text>
        <rect x="325" y="8" width="80" height="22" rx="6" fill="rgba(239, 68, 68, 0.15)"/>
        <text x="335" y="23" fill="#f87171" font-family="monospace" font-size="10" font-weight="700">₹500 Dr</text>
      </g>
    </g>
  </g>
</svg>
