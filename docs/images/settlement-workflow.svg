<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="flowShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" fill="#34d399" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">FINANCIAL SETTLEMENT PIPELINE</text>
    <text x="0" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">
      Automated Daily Reconciliation to Weekly Payout Lifecycle
    </text>
  </g>

  <!-- Flow Steps -->
  <!-- Step 1: Daily Entry -->
  <g transform="translate(60, 110)" filter="url(#flowShadow)">
    <rect x="0" y="0" width="190" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="34" rx="12" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">STEP 1: DAILY ENTRY</text>

    <g transform="translate(14, 50)">
      <text x="0" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Operator Inputs</text>
      <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="11">• Driver &amp; Date</text>
      <text x="0" y="56" fill="#94a3b8" font-family="monospace" font-size="11">• Collection (Cash)</text>
      <text x="0" y="74" fill="#94a3b8" font-family="monospace" font-size="11">• Fuel Expense</text>
      <text x="0" y="92" fill="#94a3b8" font-family="monospace" font-size="11">• Shift (Day/Night)</text>
      <text x="0" y="110" fill="#94a3b8" font-family="monospace" font-size="11">• QR Code Mapping</text>

      <rect x="0" y="130" width="162" height="70" rx="8" fill="#1e293b"/>
      <text x="10" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">Dual Lock Protection</text>
      <text x="10" y="38" fill="#38bdf8" font-family="monospace" font-size="9">pg_advisory_xact_lock</text>
      <text x="10" y="54" fill="#34d399" font-family="monospace" font-size="9">Commit in &lt; 38ms</text>

      <rect x="0" y="215" width="162" height="55" rx="8" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="10" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">Leave Validation</text>
      <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Rejects entry if driver is</text>
      <text x="10" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">on sanctioned leave</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M255 280 H285" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Step 2: Leave & Shift Engine -->
  <g transform="translate(290, 110)" filter="url(#flowShadow)">
    <rect x="0" y="0" width="190" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="34" rx="12" fill="rgba(168, 85, 247, 0.15)"/>
    <text x="14" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">STEP 2: LEAVE &amp; SHIFT</text>

    <g transform="translate(14, 50)">
      <text x="0" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Shift Integrity</text>
      <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="11">• Shift overlap gate</text>
      <text x="0" y="56" fill="#94a3b8" font-family="monospace" font-size="11">• Day/Night paired car</text>
      <text x="0" y="74" fill="#94a3b8" font-family="monospace" font-size="11">• 2 drivers per vehicle</text>

      <rect x="0" y="95" width="162" height="100" rx="8" fill="#1e293b"/>
      <text x="10" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">PostgreSQL DATERANGE</text>
      <text x="10" y="38" fill="#c084fc" font-family="monospace" font-size="9">daterange(start, end)</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Late return handling</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Actual return tracking</text>
      <text x="10" y="86" fill="#34d399" font-family="monospace" font-size="9">No overlap collisions</text>

      <rect x="0" y="210" width="162" height="60" rx="8" fill="rgba(99, 102, 241, 0.1)"/>
      <text x="10" y="20" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">Active Days Evaluated</text>
      <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Days Worked = Entries</text>
      <text x="10" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">minus authorized leaves</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M485 280 H515" stroke="#c084fc" stroke-width="2" fill="none"/>

  <!-- Step 3: Rent Matrix Scaling -->
  <g transform="translate(520, 110)" filter="url(#flowShadow)">
    <rect x="0" y="0" width="190" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="34" rx="12" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="14" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">STEP 3: RENT SCALING</text>

    <g transform="translate(14, 50)">
      <text x="0" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Dynamic Tier Matrix</text>

      <rect x="0" y="30" width="162" height="120" rx="8" fill="#1e293b"/>
      <text x="10" y="20" fill="#cbd5e1" font-family="monospace" font-size="10">6-7 Days Worked:</text>
      <text x="10" y="36" fill="#34d399" font-family="monospace" font-size="11" font-weight="700">₹1,100 / day</text>

      <text x="10" y="56" fill="#cbd5e1" font-family="monospace" font-size="10">4-5 Days Worked:</text>
      <text x="10" y="72" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="700">₹1,200 / day</text>

      <text x="10" y="92" fill="#cbd5e1" font-family="monospace" font-size="10">1-3 Days Worked:</text>
      <text x="10" y="108" fill="#f87171" font-family="monospace" font-size="11" font-weight="700">₹1,300 / day</text>

      <rect x="0" y="165" width="162" height="105" rx="8" fill="rgba(245, 158, 11, 0.08)"/>
      <text x="10" y="20" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">Automatic Sync</text>
      <text x="10" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Daily entries rent field</text>
      <text x="10" y="50" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">automatically syncs to match</text>
      <text x="10" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">weekly tier rate.</text>
      <text x="10" y="80" fill="#cbd5e1" font-family="monospace" font-size="9">Rent Total = Days × Rate</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M715 280 H745" stroke="#fbbf24" stroke-width="2" fill="none"/>

  <!-- Step 4: Weekly Wallet Balancing -->
  <g transform="translate(750, 110)" filter="url(#flowShadow)">
    <rect x="0" y="0" width="190" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="34" rx="12" fill="rgba(99, 102, 241, 0.15)"/>
    <text x="14" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">STEP 4: WALLET BALANCE</text>

    <g transform="translate(14, 50)">
      <text x="0" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">Platform Reconcile</text>
      <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="10">• Earnings (Uber/Ola)</text>
      <text x="0" y="54" fill="#94a3b8" font-family="monospace" font-size="10">• Refund Credits (+)</text>
      <text x="0" y="70" fill="#94a3b8" font-family="monospace" font-size="10">• Difference (-)</text>
      <text x="0" y="86" fill="#94a3b8" font-family="monospace" font-size="10">• Cash Collected (-)</text>
      <text x="0" y="102" fill="#94a3b8" font-family="monospace" font-size="10">• Platform Charges (-)</text>

      <rect x="0" y="120" width="162" height="70" rx="8" fill="#1e293b"/>
      <text x="10" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">Wallet Formula</text>
      <text x="10" y="38" fill="#818cf8" font-family="monospace" font-size="9">Wallet = Earnings + Refund</text>
      <text x="10" y="52" fill="#818cf8" font-family="monospace" font-size="9"> - (Diff + Cash + Charges)</text>

      <rect x="0" y="200" width="162" height="70" rx="8" fill="rgba(16, 185, 129, 0.1)"/>
      <text x="10" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">Manual Overrides</text>
      <text x="10" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Supports supervisor custom</text>
      <text x="10" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">daysWorked, rent, &amp; cash</text>
      <text x="10" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">adjustments.</text>
    </g>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M945 280 H975" stroke="#818cf8" stroke-width="2" fill="none"/>

  <!-- Step 5: Net Payout & WhatsApp -->
  <g transform="translate(980, 110)" filter="url(#flowShadow)">
    <rect x="0" y="0" width="160" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="34" rx="12" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="12" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">STEP 5: DISPATCH</text>

    <g transform="translate(12, 50)">
      <text x="0" y="16" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Net Formula</text>
      <rect x="0" y="26" width="136" height="80" rx="6" fill="#1e293b"/>
      <text x="8" y="18" fill="#34d399" font-family="monospace" font-size="9" font-weight="700">Net Payout =</text>
      <text x="8" y="32" fill="#cbd5e1" font-family="monospace" font-size="8">Wallet + Due</text>
      <text x="8" y="44" fill="#cbd5e1" font-family="monospace" font-size="8">+ Adjustments</text>
      <text x="8" y="56" fill="#f87171" font-family="monospace" font-size="8">- RentTotal</text>
      <text x="8" y="68" fill="#f87171" font-family="monospace" font-size="8">- Expenses - Food</text>

      <rect x="0" y="115" width="136" height="75" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="8" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">WhatsApp Dispatch</text>
      <text x="8" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8">One-click breakdown</text>
      <text x="8" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8">Zero empty messages</text>
      <text x="8" y="64" fill="#34d399" font-family="monospace" font-size="8">Instant Driver SMS</text>

      <rect x="0" y="200" width="136" height="75" rx="6" fill="#1e293b"/>
      <text x="8" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">PDF Settlement</text>
      <text x="8" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8">Company audit bill</text>
      <text x="8" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8">Driver receipt</text>
      <text x="8" y="66" fill="#38bdf8" font-family="monospace" font-size="8">Auto-generated</text>
    </g>
  </g>
</svg>
