    <circle cx="125" cy="22" r="3" fill="#10b981"/>
    <text x="136" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11">https://encho-cabs.prod/dashboard • Fleet Analytics OS</text>

    <!-- Top Right Status Badges -->
    <g transform="translate(930, 11)">
