    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.0)"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#dbBg)"/>

  <!-- Browser Frame Wrapper -->
  <g transform="translate(40, 30)" filter="url(#shadowHeavy)">
